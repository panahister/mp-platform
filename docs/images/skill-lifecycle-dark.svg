<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Repository-scoped MP skill lifecycle in dark mode showing installed Codex and Claude Code folders, a hash lock, bounded execution, verification, and human review">
  <title>Repository-scoped MP skill lifecycle, dark mode</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111936"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6888ff"/><stop offset="0.52" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020611" flood-opacity="0.42"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f91ad"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="618" rx="23" fill="none" stroke="#293a50"/><rect width="1200" height="7" rx="3.5" fill="url(#flow)"/>
  <text x="60" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#91a7ff">FROM PACKAGE TO PROOF</text><text x="60" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="29" font-weight="800" fill="#f5f8ff">What skill installation adds—and how it changes an agent's work.</text>
  <g transform="translate(48 154)" filter="url(#shadow)"><rect width="455" height="386" rx="20" fill="#0e1a2f" stroke="#32445e"/><rect x="0" y="0" width="455" height="58" rx="20" fill="#070e1c"/><path d="M0 38h455v20H0z" fill="#070e1c"/><circle cx="28" cy="29" r="7" fill="#6888ff"/><text x="47" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#f5f8ff">my-product/</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><text x="30" y="94" fill="#9aa7b9">├──</text><text x="72" y="94" font-weight="700" fill="#91a7ff">.agents/skills/</text><text x="222" y="94" fill="#aebbd0">Codex discovery</text><text x="30" y="124" fill="#9aa7b9">│   └──</text><text x="103" y="124" fill="#c2ccdc">mpfrontend-*/SKILL.md</text><text x="30" y="163" fill="#9aa7b9">├──</text><text x="72" y="163" font-weight="700" fill="#c4b5fd">.claude/skills/</text><text x="222" y="163" fill="#aebbd0">Claude discovery</text><text x="30" y="193" fill="#9aa7b9">│   └──</text><text x="103" y="193" fill="#c2ccdc">mpfrontend-*/SKILL.md</text><text x="30" y="232" fill="#9aa7b9">├──</text><text x="72" y="232" font-weight="700" fill="#70e0d0">.mpfrontend/</text><text x="30" y="262" fill="#9aa7b9">│   └──</text><text x="103" y="262" fill="#c2ccdc">skills-lock.json</text><text x="274" y="262" fill="#aebbd0">hash ownership</text><text x="30" y="301" fill="#9aa7b9">├──</text><text x="72" y="301" fill="#c2ccdc">AGENTS.md</text><text x="184" y="301" fill="#aebbd0">preserved</text><text x="30" y="331" fill="#9aa7b9">└──</text><text x="72" y="331" fill="#c2ccdc">CLAUDE.md</text><text x="184" y="331" fill="#aebbd0">preserved</text></g><rect x="28" y="351" width="399" height="1" fill="#293a50"/><text x="28" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#aebbd0">No global config · no postinstall · no unrelated overwrite</text></g>
  <path d="M520 347h60" stroke="#7f91ad" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(590 154)"><rect width="562" height="386" rx="20" fill="#101d38" stroke="#526fca"/><text x="30" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#91a7ff">EFFECT ON ONE ENGINEERING TASK</text><g transform="translate(30 76)"><rect width="502" height="61" rx="14" fill="#0d172a" stroke="#32445e"/><circle cx="31" cy="30" r="17" fill="#172c55"/><text x="31" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#91a7ff">1</text><text x="61" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="760" fill="#f5f8ff">Inspect before writing</text><text x="61" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#aebbd0">Read repository contracts, versions, ownership, and prerequisites.</text></g><path d="M281 139v17" stroke="#7f91ad" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(30 164)"><rect width="502" height="61" rx="14" fill="#17142e" stroke="#6756aa"/><circle cx="31" cy="30" r="17" fill="#302650"/><text x="31" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#c4b5fd">2</text><text x="61" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="760" fill="#f5f8ff">Change only the bounded surface</text><text x="61" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#bcb5d3">Use deterministic tooling; stop instead of inventing missing decisions.</text></g><path d="M281 227v17" stroke="#7f91ad" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(30 252)"><rect width="502" height="61" rx="14" fill="#0b2828" stroke="#248f84"/><circle cx="31" cy="30" r="17" fill="#10433f"/><text x="31" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#70e0d0">3</text><text x="61" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="760" fill="#f5f8ff">Prove, report, and hand back</text><text x="61" y="47" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a7c9c5">Run named checks, disclose what was not run, await human acceptance.</text></g><text x="281" y="357" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2ccdc">The skill changes the workflow—not the ownership of the product decision.</text></g>
  <text x="600" y="584" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#c2ccdc">Install → discover → inspect → implement → verify → human review</text>
</svg>
