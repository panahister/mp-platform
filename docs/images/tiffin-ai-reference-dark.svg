<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Tiffin backend reference in dark mode routes ten repository-level AI skills into nine MP Core services and proves changes through sixteen end-to-end scenario stories across two infrastructure matrices">
