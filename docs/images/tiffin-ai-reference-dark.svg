  <g transform="translate(882 184)" filter="url(#shadow)"><rect width="270" height="360" rx="20" fill="#0c302e" stroke="#2dd4bf"/><rect width="8" height="360" rx="4" fill="#2dd4bf"/><text x="28" y="41" font-family="sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#70e0d0">REFERENCE EVIDENCE</text><text x="28" y="78" font-family="sans-serif" font-size="22" font-weight="780" fill="#f5f8ff">16 journey stories</text><text x="28" y="107" font-family="sans-serif" font-size="13" fill="#b8d6d2">success and failure behavior</text><line x1="28" y1="132" x2="242" y2="132" stroke="#2d5954"/><text x="28" y="164" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Customer → restaurant</text><text x="28" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Payment → kitchen</text><text x="28" y="216" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Dispatch → tracking</text><text x="28" y="242" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Delivery → notification</text><text x="28" y="277" font-family="sans-serif" font-size="12.5" fill="#b8d6d2">duplicates · concurrency</text><text x="28" y="300" font-family="sans-serif" font-size="12.5" fill="#b8d6d2">tenants · outages · deadlines</text><rect x="28" y="319" width="214" height="24" rx="12" fill="#10433f"/><text x="135" y="335" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="750" fill="#70e0d0">2 STORAGE / EDGE MATRICES</text></g>
  <text x="600" y="588" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="650" fill="#c2ccdc">A root skill finds the owning service; the service skill protects its boundary; scenarios prove the connected outcome.</text><text x="600" y="612" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#aebbd0">Tiffin demonstrates the backend procedure model; the published frontend reference demonstrates the runtime product path, not installed frontend-agent parity.</text>
