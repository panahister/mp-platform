  <text x="60" y="65" font-family="sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#91a7ff">TIFFIN · FOOD-DELIVERY REFERENCE</text><text x="60" y="107" font-family="sans-serif" font-size="29" font-weight="800" fill="#f5f8ff">From a repository-level task to evidence across nine secured services.</text><text x="60" y="138" font-family="sans-serif" font-size="15.5" fill="#aebbd0">The reference shows routing, service-local procedure ownership, and complete business/failure journeys.</text>
