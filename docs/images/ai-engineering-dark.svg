<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="MP Platform AI engineering architecture from human decisions through canonical skills, Codex and Claude Code adapters, bounded changes, verification, and human review in dark mode">
