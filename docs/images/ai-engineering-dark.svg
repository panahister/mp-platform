    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6888ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
