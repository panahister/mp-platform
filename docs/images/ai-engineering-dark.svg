  <text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#f5f8ff">One architecture contract. Two agent adapters. Human authority stays explicit.</text>
  <text x="60" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#aebbd0">Finite procedures turn approved intent into bounded changes and observable evidence.</text>
