  <g transform="translate(48 456)"><rect width="1104" height="105" rx="18" fill="#070e1c" stroke="#293a50"/><rect width="8" height="105" rx="4" fill="url(#flow)"/><text x="32" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#91a7ff">THE NON-DELEGABLE GATE</text><text x="32" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f8ff">Humans approve domain meaning, architecture exceptions, security acceptance, design acceptance, and publication.</text><text x="32" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aebbd0">Agent portability preserves the procedure—not identical model behavior.</text></g>
