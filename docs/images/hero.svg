<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="MP Platform unifies backend, frontend, and end-to-end product engineering paths">
  <title>MP Platform: one ecosystem, three adoption paths</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#11163a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6888ff"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(990 50) rotate(135) scale(470 340)">
      <stop offset="0" stop-color="#315fe8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#315fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(340 470) rotate(-45) scale(460 260)">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020611" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="480" rx="22" fill="url(#glowB)"/>
  <rect x="0" y="0" width="1200" height="7" rx="3.5" fill="url(#signal)"/>

  <g opacity="0.22" stroke="#6888ff" fill="none">
    <path d="M875 42h175l86 86v104"/>
    <path d="M824 76h160l104 104v86"/>
    <circle cx="875" cy="42" r="4" fill="#6888ff"/>
    <circle cx="1136" cy="232" r="4" fill="#2dd4bf"/>
  </g>

  <g transform="translate(64 54)">
    <rect width="66" height="66" rx="17" fill="#315fe8"/>
    <text x="33" y="42" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">MP</text>
  </g>
  <text x="150" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#91a7ff">OPEN PRODUCT ENGINEERING ECOSYSTEM</text>
  <text x="150" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#f5f8ff">MP Platform</text>
  <text x="64" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="25" font-weight="650" fill="#f5f8ff">Architecture humans can reason about.</text>
  <text x="64" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="25" font-weight="650" fill="#7ce6d6">Procedures AI coding agents can execute safely.</text>

  <g transform="translate(64 258)" filter="url(#shadow)">
    <rect width="330" height="142" rx="16" fill="#0e1a36" stroke="#476fe9"/>
    <rect width="7" height="142" rx="3.5" fill="#6888ff"/>
    <text x="28" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.6" fill="#91a7ff">BACKEND</text>
    <text x="28" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="760" fill="#f5f8ff">MP Core</text>
    <text x="28" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#aebbd0">.NET 10 packages · CLI · templates</text>
    <text x="28" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#aebbd0">architecture guarantees · AI procedures</text>
  </g>

  <g transform="translate(435 258)" filter="url(#shadow)">
    <rect width="330" height="142" rx="16" fill="#1d173a" stroke="#8168dc"/>
    <rect width="7" height="142" rx="3.5" fill="#a78bfa"/>
    <text x="28" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.6" fill="#c4b5fd">FRONTEND</text>
    <text x="28" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="760" fill="#f5f8ff">MP Frontend</text>
    <text x="28" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#bcb5d3">contracts · secure BFF · realtime</text>
    <text x="28" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#bcb5d3">design ownership · AI procedures</text>
  </g>

  <g transform="translate(806 258)" filter="url(#shadow)">
    <rect width="330" height="142" rx="16" fill="#082d2a" stroke="#24bda9"/>
    <rect width="7" height="142" rx="3.5" fill="#2dd4bf"/>
    <text x="28" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.6" fill="#70e0d0">END TO END</text>
    <text x="28" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="760" fill="#f5f8ff">Tiffin Reference</text>
    <text x="28" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#a7c9c5">customer · operations · nine services</text>
    <text x="28" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#a7c9c5">identity · edge · data · failure paths</text>
  </g>

  <line x1="64" y1="438" x2="1136" y2="438" stroke="#293a50"/>
  <text x="64" y="462" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#8e9db2">human decision gates</text>
  <text x="600" y="462" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#8e9db2">repository-scoped AI</text>
  <text x="1136" y="462" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#8e9db2">evidence before claims</text>
</svg>
