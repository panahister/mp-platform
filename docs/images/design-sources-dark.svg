<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="MP Frontend design-source choices in dark mode: code-first and consumer-owned DLS are implemented, while a Community DLS is not available in the MVP">
  <title>MP Frontend design-source paths, dark mode</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111936"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6888ff"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020611" flood-opacity="0.42"/></filter></defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="538" rx="23" fill="none" stroke="#293a50"/><rect width="1200" height="7" rx="3.5" fill="url(#flow)"/>
  <text x="60" y="65" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#91a7ff">DESIGN OWNERSHIP IS A PRODUCT CHOICE</text><text x="60" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="29" font-weight="800" fill="#f5f8ff">Start from code, bring your own DLS, or wait for a future public source.</text><text x="60" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#aebbd0">The MVP implements two paths and explicitly refuses the unshipped third path.</text>
  <g transform="translate(48 190)" filter="url(#shadow)"><rect width="336" height="260" rx="20" fill="#0e1a2f" stroke="#526fca"/><rect width="8" height="260" rx="4" fill="#6888ff"/><rect x="228" y="22" width="84" height="28" rx="14" fill="#10433f"/><text x="270" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" fill="#70e0d0">READY</text><text x="28" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#91a7ff">--design-source none</text><text x="28" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="780" fill="#f5f8ff">Code-first</text><text x="28" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#aebbd0">Use code-owned tokens and</text><text x="28" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#aebbd0">components immediately.</text><line x1="28" y1="171" x2="308" y2="171" stroke="#293a50"/><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#91a7ff">STATE</text><text x="89" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c2ccdc">disabled · usable</text><text x="28" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#91a7ff">LATER</text><text x="89" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c2ccdc">may attach existing</text></g>
  <g transform="translate(432 190)" filter="url(#shadow)"><rect width="336" height="260" rx="20" fill="#18152f" stroke="#6756aa"/><rect width="8" height="260" rx="4" fill="#a78bfa"/><rect x="228" y="22" width="84" height="28" rx="14" fill="#10433f"/><text x="270" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" fill="#70e0d0">READY</text><text x="28" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#c4b5fd">--design-source existing</text><text x="28" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="780" fill="#f5f8ff">Bring your own DLS</text><text x="28" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#bcb5d3">Attach a reviewed local binding</text><text x="28" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#bcb5d3">without transferring ownership.</text><line x1="28" y1="171" x2="308" y2="171" stroke="#332c4f"/><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#c4b5fd">STATE</text><text x="89" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#d2cce3">pending → attached</text><text x="28" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#c4b5fd">FLOW</text><text x="89" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#d2cce3">reviewed · hash-bound</text></g>
  <g transform="translate(816 190)" filter="url(#shadow)"><rect width="336" height="260" rx="20" fill="#111a29" stroke="#536174" stroke-dasharray="7 6"/><rect width="8" height="260" rx="4" fill="#697789"/><rect x="194" y="22" width="118" height="28" rx="14" fill="#283446"/><text x="253" y="41" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" fill="#aebbd0">NOT IN MVP</text><text x="28" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#9aa7b9">no accepted CLI mode</text><text x="28" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="780" fill="#cbd4e1">MP Community DLS</text><text x="28" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#9aa7b9">Future path only; no public,</text><text x="28" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#9aa7b9">versioned design source ships today.</text><line x1="28" y1="171" x2="308" y2="171" stroke="#293444"/><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#9aa7b9">LEGACY</text><text x="93" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aebbd0">template mode refused</text><text x="28" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="720" fill="#9aa7b9">RULE</text><text x="93" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aebbd0">do not promise it</text></g>
  <text x="600" y="505" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#c2ccdc">MP Frontend validates reviewed local contracts. It never fetches, mutates, or publishes a Figma file.</text>
</svg>
