<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="MP Platform AI engineering architecture from human decisions through canonical skills, Codex and Claude Code adapters, bounded changes, verification, and human review">
  <title>MP Platform AI engineering architecture</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#315fe8"/>
      <stop offset="0.55" stop-color="#6d5bd0"/>
      <stop offset="1" stop-color="#14a695"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18305e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71809a"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#f4f7fc"/>
  <rect x="1" y="1" width="1198" height="618" rx="23" fill="none" stroke="#d7deeb"/>
  <rect x="0" y="0" width="1200" height="7" rx="3.5" fill="url(#flow)"/>

  <text x="60" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#315fe8">AI ENGINEERING, GOVERNED BY THE REPOSITORY</text>
  <text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#101827">One architecture contract. Two agent adapters. Human authority stays explicit.</text>
  <text x="60" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#5b687c">Finite procedures turn approved intent into bounded changes and observable evidence.</text>

  <g stroke="#71809a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M256 304h45"/>
    <path d="M510 304h45"/>
    <path d="M764 304h45"/>
    <path d="M1018 304h45"/>
  </g>

  <g transform="translate(48 205)" filter="url(#shadow)">
    <rect width="208" height="198" rx="18" fill="#fff" stroke="#cdd7e7"/>
    <circle cx="34" cy="35" r="16" fill="#e7edff"/>
    <path d="M27 35l5 5 9-11" stroke="#315fe8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#315fe8">01 · AUTHORITY</text>
    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="760" fill="#101827">Human decisions</text>
    <text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Domain meaning</text>
    <text x="24" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Security posture</text>
    <text x="24" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Acceptance boundary</text>
  </g>

  <g transform="translate(302 205)" filter="url(#shadow)">
    <rect width="208" height="198" rx="18" fill="url(#panel)" stroke="#9aace8"/>
    <circle cx="34" cy="35" r="16" fill="#315fe8"/>
    <path d="M27 30h14M27 35h14M27 40h10" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <text x="60" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#315fe8">02 · CONTRACT</text>
    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="760" fill="#101827">Canonical skill</text>
    <text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Prerequisites</text>
    <text x="24" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Refusal conditions</text>
    <text x="24" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Evidence commands</text>
  </g>

  <g transform="translate(556 205)" filter="url(#shadow)">
    <rect width="208" height="198" rx="18" fill="#fff" stroke="#cfc8ee"/>
    <circle cx="34" cy="35" r="16" fill="#eeeafd"/>
    <path d="M27 39l7-9 7 9M34 30v15" stroke="#6d5bd0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#6d5bd0">03 · DISCOVERY</text>
    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="760" fill="#101827">Native adapters</text>
    <rect x="24" y="103" width="72" height="30" rx="15" fill="#e7edff"/>
    <text x="60" y="123" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#315fe8">Codex</text>
    <rect x="104" y="103" width="80" height="30" rx="15" fill="#eeeafd"/>
    <text x="144" y="123" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#6d5bd0">Claude</text>
    <text x="24" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">One procedure source</text>
  </g>

  <g transform="translate(810 205)" filter="url(#shadow)">
    <rect width="208" height="198" rx="18" fill="#fff" stroke="#cdd7e7"/>
    <circle cx="34" cy="35" r="16" fill="#e8f8f5"/>
    <path d="M27 36l5 5 10-12M25 46h18" stroke="#149786" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#149786">04 · EXECUTION</text>
    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" font-weight="760" fill="#101827">Bounded change</text>
    <text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Declared ownership</text>
    <text x="24" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">Deterministic tools</text>
    <text x="24" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b687c">No silent override</text>
  </g>

  <g transform="translate(1064 205)" filter="url(#shadow)">
    <rect width="88" height="198" rx="18" fill="#0d233f" stroke="#14a695"/>
    <circle cx="44" cy="38" r="18" fill="#14a695"/>
    <path d="M35 38l6 6 12-14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="750" fill="#8be6da">05</text>
    <text x="44" y="106" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="750" fill="#fff">PROVE</text>
    <text x="44" y="137" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#b8d6d2">tests</text>
    <text x="44" y="158" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#b8d6d2">checks</text>
    <text x="44" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" fill="#b8d6d2">review</text>
  </g>

  <g transform="translate(48 456)">
    <rect width="1104" height="105" rx="18" fill="#0d1b31"/>
    <rect width="8" height="105" rx="4" fill="url(#flow)"/>
    <text x="32" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.5" fill="#91a7ff">THE NON-DELEGABLE GATE</text>
    <text x="32" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f8ff">Humans approve domain meaning, architecture exceptions, security acceptance, design acceptance, and publication.</text>
    <text x="32" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#aebbd0">Agent portability preserves the procedure—not identical model behavior.</text>
  </g>
</svg>
