<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Tiffin backend reference routes ten repository-level AI skills into nine MP Core services and proves changes through sixteen end-to-end scenario stories across two infrastructure matrices">
  <title>Tiffin as the full-stack AI procedure reference</title>
  <defs><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#315fe8"/><stop offset="0.5" stop-color="#6d5bd0"/><stop offset="1" stop-color="#14a695"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#18305e" flood-opacity="0.12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#708098"/></marker></defs>
  <rect width="1200" height="640" rx="24" fill="#f4f7fc"/><rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#d7deeb"/><rect width="1200" height="7" rx="3.5" fill="url(#flow)"/>
  <text x="60" y="65" font-family="sans-serif" font-size="13" font-weight="750" letter-spacing="2.1" fill="#315fe8">TIFFIN · FOOD-DELIVERY REFERENCE</text><text x="60" y="107" font-family="sans-serif" font-size="29" font-weight="800" fill="#101827">From a repository-level task to evidence across nine secured services.</text><text x="60" y="138" font-family="sans-serif" font-size="15.5" fill="#5b687c">The reference shows routing, service-local procedure ownership, and complete business/failure journeys.</text>
  <g transform="translate(48 184)" filter="url(#shadow)"><rect width="278" height="360" rx="20" fill="#fff" stroke="#9aace8"/><rect width="8" height="360" rx="4" fill="#315fe8"/><text x="28" y="41" font-family="sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#315fe8">REPOSITORY DISCOVERY</text><text x="28" y="78" font-family="sans-serif" font-size="22" font-weight="780" fill="#101827">10 Tiffin routers</text><text x="28" y="108" font-family="sans-serif" font-size="13.5" fill="#5b687c">Available to Codex and Claude</text><line x1="28" y1="132" x2="250" y2="132" stroke="#e0e6f0"/><g font-family="monospace" font-size="12.5" fill="#334155"><text x="28" y="165">tiffin-plan-*</text><text x="28" y="190">tiffin-implement-*</text><text x="28" y="215">tiffin-design-*</text><text x="28" y="240">tiffin-apply-*</text><text x="28" y="265">tiffin-configure-*</text><text x="28" y="290">tiffin-integrate-*</text><text x="28" y="315">tiffin-verify-*</text></g><text x="28" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#315fe8">ROUTE BY TASK AND SERVICE</text></g>
  <path d="M340 364h42" stroke="#708098" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(394 184)" filter="url(#shadow)"><rect width="420" height="360" rx="20" fill="#fff" stroke="#cfc8ee"/><rect width="8" height="360" rx="4" fill="#6d5bd0"/><text x="28" y="41" font-family="sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#6d5bd0">SERVICE-LOCAL AUTHORITY</text><text x="28" y="78" font-family="sans-serif" font-size="22" font-weight="780" fill="#101827">9 MP Core backends</text><text x="28" y="108" font-family="sans-serif" font-size="13.5" fill="#5b687c">Each carries the 10 canonical procedures</text>
    <g font-family="sans-serif" font-size="12.5" font-weight="700"><rect x="28" y="139" width="108" height="45" rx="12" fill="#eef3ff"/><text x="82" y="167" text-anchor="middle" fill="#315fe8">Access</text><rect x="154" y="139" width="108" height="45" rx="12" fill="#eef3ff"/><text x="208" y="167" text-anchor="middle" fill="#315fe8">Media</text><rect x="280" y="139" width="112" height="45" rx="12" fill="#eef3ff"/><text x="336" y="167" text-anchor="middle" fill="#315fe8">Restaurants</text><rect x="28" y="198" width="108" height="45" rx="12" fill="#f1edff"/><text x="82" y="226" text-anchor="middle" fill="#6d5bd0">Ordering</text><rect x="154" y="198" width="108" height="45" rx="12" fill="#f1edff"/><text x="208" y="226" text-anchor="middle" fill="#6d5bd0">Payments</text><rect x="280" y="198" width="112" height="45" rx="12" fill="#f1edff"/><text x="336" y="226" text-anchor="middle" fill="#6d5bd0">Kitchen</text><rect x="28" y="257" width="108" height="45" rx="12" fill="#e8f8f5"/><text x="82" y="285" text-anchor="middle" fill="#08796c">Dispatch</text><rect x="154" y="257" width="108" height="45" rx="12" fill="#e8f8f5"/><text x="208" y="285" text-anchor="middle" fill="#08796c">Tracking</text><rect x="280" y="257" width="112" height="45" rx="12" fill="#e8f8f5"/><text x="336" y="285" text-anchor="middle" fill="#08796c">Notifications</text></g>
    <text x="210" y="334" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b687c">service/.mpcore/skills/mpcore-*/SKILL.md</text>
  </g>
  <path d="M828 364h42" stroke="#708098" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(882 184)" filter="url(#shadow)"><rect width="270" height="360" rx="20" fill="#0d233f" stroke="#14a695"/><rect width="8" height="360" rx="4" fill="#2dd4bf"/><text x="28" y="41" font-family="sans-serif" font-size="11" font-weight="750" letter-spacing="1.4" fill="#70e0d0">REFERENCE EVIDENCE</text><text x="28" y="78" font-family="sans-serif" font-size="22" font-weight="780" fill="#f5f8ff">16 journey stories</text><text x="28" y="107" font-family="sans-serif" font-size="13" fill="#b8d6d2">success and failure behavior</text><line x1="28" y1="132" x2="242" y2="132" stroke="#34536a"/><text x="28" y="164" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Customer → restaurant</text><text x="28" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Payment → kitchen</text><text x="28" y="216" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Dispatch → tracking</text><text x="28" y="242" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Delivery → notification</text><text x="28" y="277" font-family="sans-serif" font-size="12.5" fill="#b8d6d2">duplicates · concurrency</text><text x="28" y="300" font-family="sans-serif" font-size="12.5" fill="#b8d6d2">tenants · outages · deadlines</text><rect x="28" y="319" width="214" height="24" rx="12" fill="#10433f"/><text x="135" y="335" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="750" fill="#70e0d0">2 STORAGE / EDGE MATRICES</text></g>
  <text x="600" y="588" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="650" fill="#334155">A root skill finds the owning service; the service skill protects its boundary; scenarios prove the connected outcome.</text>
  <text x="600" y="612" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#5b687c">Tiffin demonstrates the backend procedure model; the published frontend reference demonstrates the runtime product path, not installed frontend-agent parity.</text>
</svg>
