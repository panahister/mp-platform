name: Documentation defect
description: Report broken navigation, an inaccurate claim, or an unclear evidence boundary
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link the affected section or file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is broken, inaccurate, or unclear.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link the owning repository, source, test, scenario, or observed run.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secrets, personal data, or private design material.
          required: true
        - label: This is not a security vulnerability.
          required: true

